{% extends "base.html" %}
{% block content %}

<h2>Reset Password</h2>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="alert alert-info">{{ messages[0] }}</div>
  {% endif %}
{% endwith %}

<form method="POST" class="card p-4 col-md-5">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input name="password" type="password" class="form-control mb-2" placeholder="New password" minlength="6" required>
  <button class="btn btn-primary">Reset Password</button>
</form>

{% endblock %}
